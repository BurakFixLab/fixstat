name: New model sensor data
description: Share sensor data from a Mac model that is not verified yet.
title: "[Model] "
labels: ["sensor-map"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please make sure **no serial numbers** are included. `sensordump` masks
        them by default — do not use `--include-serial`.
  - type: input
    id: model
    attributes:
      label: Model identifier
      description: "Output of `sysctl -n hw.model`, e.g. MacBookPro18,3"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Mac
      description: "e.g. MacBook Pro (14-inch, 2021)"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      description: "e.g. Apple M1 Pro, Intel Core i7"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board (optional)
      description: "Board target (sensordump shows it next to the model, e.g. J313) or board number"
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Output of `sw_vers -productVersion`"
    validations:
      required: true
  - type: textarea
    id: sensordump
    attributes:
      label: sensordump output (masked)
      description: "Output of `.build/release/sensordump` (table) or `--json`"
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: sensormap report (optional)
      description: "Output of `sensormap report` if you ran the load tests"
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: "Anything you know about the sensors (e.g. from schematics / board view)."
